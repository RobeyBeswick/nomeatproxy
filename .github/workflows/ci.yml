name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - name: Build downloadable npm package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: nomeatproxy-npm
          path: artifacts/*.tgz
          if-no-files-found: error
